<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque Nobre</title>
  <link rel="stylesheet" href="/agenda/css/style.css">
  <link rel="stylesheet" href="/financeiro/css/style.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/estoque/manifest.json">
  <meta name="theme-color" content="#4a7c59">
  <link rel="apple-touch-icon" href="/agenda/assets/logo.png">
</head>
<body>
  <div id="app-content" class="app-container">
    <div class="top-actions">
      <a href="../financeiro/admin.html" id="btn-admin" class="btn-icon shadow-sm btn-admin hidden" title="Administração">🛡️</a>
      <a href="ajuda.html" class="btn-icon shadow-sm" title="Ajuda">❓</a>
      <a href="/" class="btn-icon shadow-sm" title="Voltar ao Portal">🏠</a>
    </div>

    <header>
      <div style="display: flex; justify-content: center; align-items: center; gap: 0.75rem;">
        <div class="logo-box" style="margin: 0;">📦</div>
        <h1>Controle de Estoque</h1>
      </div>
      <p id="user-email-display" style="margin-top: 0.5rem;"></p>
    </header>

    <nav class="nav-tabs">
      <div class="nav-tab active" data-target="view-products">Produtos</div>
      <div class="nav-tab" data-target="view-movements">Movimentações</div>
      <div style="flex-grow: 1;"></div>
      <div class="nav-stats" style="display: flex; gap: 1rem; padding: 0 1rem; align-items: center; font-size: 0.85rem; color: #4a7c59; font-weight: bold;">
        <span id="stat-stock-value">Estoque: R$ 0,00</span>
        <span id="stat-sale-total">Vendas: R$ 0,00</span>
        <span id="stat-baixa-total" style="color: #d9534f;">Baixas: R$ 0,00</span>
      </div>
    </nav>

    <!-- View Produtos -->
    <section id="view-products" class="tab-content">
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
        <button id="btn-new-bought" class="btn-wide bg-primary shadow-sm">+ Comprado</button>
        <button id="btn-new-created" class="btn-wide bg-secondary shadow-sm">+ Criado</button>
      </div>

      <div class="filter-container" style="flex-wrap: wrap; gap: 0.5rem; background: #f0f7f0; padding: 1rem; border-radius: 8px;">
        <div class="form-group" style="margin: 0; flex: 2; min-width: 200px;">
          <label style="font-size: 0.75rem;">Buscar Produto:</label>
          <input type="text" id="filter-product-name" placeholder="Digite a letra ou nome..." style="padding: 4px; font-size: 0.85rem;">
        </div>
        <div class="form-group" style="margin: 0; flex: 1; min-width: 130px;">
          <label style="font-size: 0.75rem;">Por Data:</label>
          <input type="date" id="filter-product-date" style="padding: 4px; font-size: 0.85rem;">
        </div>
        <div style="flex: 1 1 100%; display: flex; gap: 0.5rem; margin-top: 0.5rem;">
          <button class="filter-btn active" data-type="todos">Todos</button>
          <button class="filter-btn" data-type="comprado">Comprados</button>
          <button class="filter-btn" data-type="criado">Criados</button>
          <button class="filter-btn" data-type="minimo">Estoque Mínimo</button>
        </div>
      </div>

      <div id="products-list" class="data-list">
        <!-- JS -->
      </div>
    </section>

    <!-- View Movimentações -->
    <section id="view-movements" class="tab-content hidden">
      <div class="filter-container" style="flex-wrap: wrap; gap: 0.5rem; background: #f0f7f0; padding: 1rem; border-radius: 8px;">
        <div class="form-group" style="margin: 0; flex: 1; min-width: 130px;">
          <label style="font-size: 0.75rem;">De:</label>
          <input type="date" id="mov-start-date" style="padding: 4px; font-size: 0.85rem;">
        </div>
        <div class="form-group" style="margin: 0; flex: 1; min-width: 130px;">
          <label style="font-size: 0.75rem;">Até:</label>
          <input type="date" id="mov-end-date" style="padding: 4px; font-size: 0.85rem;">
        </div>
        <button id="btn-filter-movements" class="btn-wide bg-primary" style="flex: 0 0 auto; width: auto; padding: 0 1rem; height: 38px; align-self: flex-end;">Filtrar</button>
      </div>

      <div id="movements-list" class="data-list">
        <!-- JS -->
      </div>
    </section>
  </div>

  <!-- Modal Produto Comprado -->
  <div id="modal-bought" class="modal-overlay hidden">
    <div class="modal-card">
      <span class="close-x" onclick="closeModal('modal-bought')">✕</span>
      <h2>Novo Produto Comprado</h2>
      <form id="form-bought">
        <input type="hidden" id="bought-id">
        <div class="form-group">
          <label>Nome do Produto</label>
          <input type="text" id="bought-name" list="bought-names" required>
          <datalist id="bought-names"></datalist>
        </div>
        <div class="form-group">
          <label>Quantidade Inicial</label>
          <input type="number" step="1" min="1" id="bought-qty" value="1" required>
        </div>
        <div class="form-group">
          <label>Estoque Mínimo</label>
          <input type="number" step="0.01" id="bought-min" value="0" required>
        </div>
        <div class="form-group">
          <label>Valor Pago (R$)</label>
          <input type="number" step="0.01" id="bought-value" value="0">
        </div>
        <div class="form-group">
          <label>Local da Compra</label>
          <input type="text" id="bought-location">
        </div>
        <button type="submit" class="btn-wide bg-primary">Salvar</button>
      </form>
    </div>
  </div>

  <!-- Modal Produto Criado -->
  <div id="modal-created" class="modal-overlay hidden">
    <div class="modal-card">
      <span class="close-x" onclick="closeModal('modal-created')">✕</span>
      <h2>Novo Produto Criado</h2>
      <form id="form-created">
        <input type="hidden" id="created-id">
        <div class="form-group">
          <label>Nome do Produto</label>
          <input type="text" id="created-name" list="created-names" required>
          <datalist id="created-names"></datalist>
        </div>
        <div class="form-group">
          <label>Quantidade Inicial</label>
          <input type="number" step="1" min="1" id="created-qty" value="1" required>
        </div>
        <div class="form-group">
          <label>Estoque Mínimo</label>
          <input type="number" step="0.01" id="created-min" value="0" required>
        </div>
        <div class="form-group">
          <label>Custo de Produção (R$)</label>
          <input type="number" step="0.01" id="created-cost" value="0">
        </div>
        <button type="submit" class="btn-wide bg-primary">Salvar</button>
      </form>
    </div>
  </div>

  <!-- Modal Movimentação -->
  <div id="modal-movement" class="modal-overlay hidden">
    <div class="modal-card">
      <span class="close-x" onclick="closeModal('modal-movement')">✕</span>
      <h2 id="mov-title">Movimentação</h2>
      <p id="mov-stock-info" style="font-size: 0.9rem; color: #666; margin-bottom: 0.5rem;"></p>
      <div id="mov-batches-info" style="margin-bottom: 1rem;"></div>
      <form id="form-movement">
        <input type="hidden" id="mov-product-id">
        <input type="hidden" id="mov-type">
        <input type="hidden" id="mov-batch-id">
        <div id="group-out-type" class="form-group hidden">
          <label>Tipo de Saída</label>
          <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
            <label style="display: flex; align-items: center; gap: 0.25rem; cursor: pointer;">
              <input type="radio" name="out-type" value="venda" checked> Venda
            </label>
            <label style="display: flex; align-items: center; gap: 0.25rem; cursor: pointer;">
              <input type="radio" name="out-type" value="baixa"> Baixa
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>Quantidade</label>
          <input type="number" step="1" min="1" id="mov-qty" required>
        </div>
        <div id="mov-total-display" style="margin-bottom: 1rem; font-weight: bold; color: #4a7c59; display: none;">
          Total: R$ 0,00
        </div>
        <div id="group-entry-value" class="form-group hidden">
          <label id="label-entry-value">Valor Pago (R$)</label>
          <input type="number" step="0.01" id="mov-entry-value" value="0">
        </div>
        <div id="group-sale-value" class="form-group hidden">
          <label>Valor da Venda (R$)</label>
          <input type="number" step="0.01" id="mov-sale-value" value="0">
        </div>
        <div class="form-group">
          <label>Motivo (opcional)</label>
          <input type="text" id="mov-reason">
        </div>
        <button id="btn-confirm-movement" type="submit" class="btn-wide bg-primary">Confirmar</button>
      </form>
    </div>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
