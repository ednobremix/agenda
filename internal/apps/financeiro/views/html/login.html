<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro Nobre - Login</title>
  <link rel="stylesheet" href="/agenda/css/style.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div style="position: absolute; top: 1rem; right: 1rem;">
    <button onclick="clearCache()" class="btn-icon" title="Limpar Cache" style="background: white; border: 1px solid hsl(var(--border)); border-radius: 0.5rem; padding: 0 0.5rem; height: 2.5rem; display: flex; align-items: center; cursor: pointer;">🧹 Limpar Cache</button>
  </div>
  <div id="auth-container" class="auth-container">
    <div id="login-card" class="modal-card">
      <div class="logo-box">💰</div>
      <h2>Financeiro</h2>
      <p style="text-align: center; color: hsl(var(--muted-foreground)); margin-bottom: 1.5rem;">Controle seus gastos e ganhos</p>
      <div id="google-login-btn" style="display: flex; justify-content: center; margin-top: 1.5rem;"></div>
      
      <p style="margin-top: 1rem; text-align: center; font-size: 0.875rem;">
        Para cadastrar sua empresa, acesse a página inicial e utilize o login do Google.
      </p>

      <p style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
        <a href="/" style="color: hsl(var(--muted-foreground)); text-decoration: none;">← Voltar ao Início</a>
      </p>
    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
