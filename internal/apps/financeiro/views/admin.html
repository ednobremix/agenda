<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Financeiro Nobre</title>
  <link rel="stylesheet" href="/agenda/style.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .admin-card {
      background: white;
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      border: 1px solid hsl(var(--border));
    }
    .back-link {
      text-decoration: none;
      color: hsl(var(--primary));
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .view-switcher {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.5rem;
    }
    .view-btn {
      background: none;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-weight: 600;
      color: #666;
    }
    .view-btn.active {
      color: hsl(var(--primary));
      border-bottom: 2px solid hsl(var(--primary));
    }
    .admin-table-container {
      overflow-x: auto;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    .admin-table th, .admin-table td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    .admin-table th {
      background: #f9f9f9;
      font-weight: 600;
    }
    .dot {
      height: 10px;
      width: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }
    .dot.paid { background-color: #22c55e; }
    .dot.unpaid { background-color: #eab308; }
    .dot.overdue { background-color: #ef4444; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <a href="index.html" class="back-link">← Voltar para Financeiro</a>
      <h1>Painel Administrativo</h1>
      <button id="btn-logout-admin" class="btn-icon">🚪 Sair</button>
    </div>

    <div class="admin-card">
      <div class="view-switcher">
        <button id="admin-tab-users" class="view-btn active">Usuários</button>
        <button id="admin-tab-payments" class="view-btn">Pagamentos do Sistema</button>
      </div>

      <div id="admin-view-users">
        <div style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div style="display: flex; gap: 0.5rem; align-items: center;">
            <label for="filter-app" style="font-weight: 600;">Filtrar por App:</label>
            <select id="filter-app" style="padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #ddd;">
              <option value="all">Todos</option>
              <option value="agenda">Agenda Nobre</option>
              <option value="financeiro">Financeiro Nobre</option>
              <option value="both">Ambos</option>
            </select>
          </div>
          <div style="background: hsl(var(--primary)); color: white; padding: 0.5rem 1rem; border-radius: 2rem; font-weight: 600; font-size: 0.875rem;">
            Total: <span id="user-count">0</span> usuários
          </div>
        </div>
        <div class="admin-table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Acessos</th>
                <th>Empresa/Ramo</th>
                <th>Qtd. Prof.</th>
                <th>Agend. Livre</th>
                <th>Cadastro em</th>
                <th>Tempo de Uso</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="admin-user-list">
              <!-- Preenchido via JS -->
            </tbody>
          </table>
        </div>
      </div>

      <div id="admin-view-payments" class="hidden">
        <div style="margin-bottom: 1rem; display: flex; justify-content: flex-end; gap: 0.5rem;">
          <button id="btn-payment-history" class="btn-wide bg-secondary shadow-sm" style="width: auto;">Ver Histórico</button>
          <button id="btn-new-payment" class="btn-wide bg-primary shadow-sm" style="width: auto;">+ Agendar Pagamento</button>
        </div>
        <div class="admin-table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Usuário</th>
                <th>Referência</th>
                <th>Valor</th>
                <th>Vencimento</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="admin-payment-list">
              <!-- Preenchido via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Novo Pagamento -->
  <div id="payment-modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <span id="close-payment-modal" class="close-x">✕</span>
      <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem;">Novo Lançamento Financeiro</h2>
      <form id="payment-form">
        <div class="form-group">
          <label for="payment-user-id">Usuário</label>
          <select id="payment-user-id" required>
            <!-- Preenchido via JS -->
          </select>
        </div>
        <div class="form-group">
          <label for="payment-reference">Referência (ex: Mensalidade Outubro)</label>
          <input type="text" id="payment-reference" required placeholder="Ex: Mensalidade">
        </div>
        <div class="form-group">
          <label for="payment-amount">Valor (R$)</label>
          <input type="number" step="0.01" id="payment-amount" required>
        </div>
        <div class="form-group">
          <label for="payment-due-date">Data de Vencimento</label>
          <input type="date" id="payment-due-date" required>
        </div>
        <button type="submit" class="btn-wide bg-primary shadow-sm">Lançar Pagamento</button>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
