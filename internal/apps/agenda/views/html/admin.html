<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Agenda de Serviços</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/agenda/manifest.json">
  <meta name="theme-color" content="#4a7c59">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="agenda">
  <link rel="apple-touch-icon" href="../assets/logo.png">
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <a href="/" class="back-link">← Voltar ao Portal</a>
      <h1>Painel Administrativo</h1>
    </div>

    <div class="admin-card">
      <div class="view-switcher">
        <button id="admin-tab-users" class="view-btn active">Usuários</button>
        <button id="admin-tab-payments" class="view-btn">Pagamentos</button>
      </div>

      <div id="admin-view-users">
        <div class="mb-4 flex justify-between items-center flex-wrap gap-4">
          <div class="flex gap-2 items-center">
            <label for="filter-app" class="font-semibold">Filtrar por App:</label>
            <select id="filter-app" class="p-2 rounded-lg border-border">
              <option value="all">Todos</option>
              <option value="agenda">Agenda de Serviços</option>
              <option value="financeiro">Financeiro Nobre</option>
              <option value="estoque">Estoque Nobre</option>
              <option value="all_apps">Todos os Apps</option>
            </select>
          </div>
          <div class="bg-primary text-primary-foreground p-2 px-4 rounded-full font-semibold text-sm">
            Total: <span id="user-count">0</span> usuários
          </div>
        </div>
        <div class="admin-table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Acessos</th>
                <th>Empresa/Ramo</th>
                <th>Qtd. Prof.</th>
                <th>Agend. Livre</th>
                <th>Cadastro em</th>
                <th>Tempo de Uso</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="admin-user-list">
              <!-- Preenchido via JS -->
            </tbody>
          </table>
        </div>
      </div>

      <div id="admin-view-payments" class="hidden">
        <div class="mb-4 flex justify-end gap-2">
          <button id="btn-payment-history" class="btn-wide bg-secondary shadow-sm w-auto">Ver Histórico</button>
          <button id="btn-new-payment" class="btn-wide bg-primary shadow-sm w-auto">+ Agendar Pagamento</button>
        </div>
        <div class="admin-table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Usuário</th>
                <th>Referência</th>
                <th>Valor</th>
                <th>Vencimento</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="admin-payment-list">
              <!-- Preenchido via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Novo Pagamento -->
  <div id="payment-modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <span id="close-payment-modal" class="close-x">✕</span>
      <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem;">Novo Lançamento Financeiro</h2>
      <form id="payment-form">
        <div class="form-group">
          <label for="payment-user-id">Usuário</label>
          <select id="payment-user-id" required>
            <!-- Preenchido via JS -->
          </select>
        </div>
        <div class="form-group">
          <label for="payment-reference">Referência (ex: Mensalidade Outubro)</label>
          <input type="text" id="payment-reference" required placeholder="Ex: Mensalidade">
        </div>
        <div class="form-group">
          <label for="payment-amount">Valor (R$)</label>
          <input type="number" step="0.01" id="payment-amount" required>
        </div>
        <div class="form-group">
          <label for="payment-due-date">Data de Vencimento</label>
          <input type="date" id="payment-due-date" required>
        </div>
        <button type="submit" class="btn-wide bg-primary shadow-sm">Lançar Pagamento</button>
      </form>
    </div>
  </div>

  <script src="../js/admin.js"></script>
</body>
</html>
